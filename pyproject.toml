[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-blast-radius"
version = "0.2.0"
description = "Score a Terraform plan by how badly it can hurt, and gate the PR on it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shubh Malhotra", email = "shubhmalhotra07@gmail.com" }]
keywords = ["terraform", "iac", "ci-cd", "risk", "devops", "github-actions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
tf-blast-radius = "tfblast.cli:main"

[project.urls]
Homepage = "https://github.com/s3cretagent/tf-blast-radius"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.11"
packages = ["tfblast"]
mypy_path = "src"
strict = true
warn_unreachable = true
